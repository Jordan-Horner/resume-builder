services:
  resume-builder:
    build:
      context: .
    image: resume-builder:${RESUME_BUILDER_IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["serve"]
    environment:
      RESUME_BUILDER_WORKSPACE: /workspace
      RESUME_BUILDER_AUTOMATION_STATE: /state/automation-state.sqlite
      RESUME_BUILDER_GMAIL_STATE: /state/gmail-state.sqlite
      RESUME_BUILDER_GMAIL_TOKEN: /state/gmail-token.json
      RESUME_BUILDER_AGENT_STATE: /state/agent-state.sqlite
      RESUME_BUILDER_TELEGRAM_TOKEN_FILE: /state/telegram-bot-token
      RESUME_BUILDER_STATE_DIR: /state
      RESUME_BUILDER_WEB_PORT: 8765
      RESUME_BUILDER_DISCORD_WEBHOOK: ${RESUME_BUILDER_DISCORD_WEBHOOK:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RESUME_BUILDER_TELEGRAM_BOT_TOKEN: ${RESUME_BUILDER_TELEGRAM_BOT_TOKEN:-}
      RESUME_BUILDER_LOG_LEVEL: ${RESUME_BUILDER_LOG_LEVEL:-INFO}
      RESUME_BUILDER_WORKSPACE_SYNC_ENABLED: ${RESUME_BUILDER_WORKSPACE_SYNC_ENABLED:-false}
      RESUME_BUILDER_WORKSPACE_SYNC_INTERVAL_SECONDS: ${RESUME_BUILDER_WORKSPACE_SYNC_INTERVAL_SECONDS:-300}
      RESUME_BUILDER_WORKSPACE_SYNC_SSH_KEY_FILE: ${RESUME_BUILDER_WORKSPACE_SYNC_SSH_KEY_FILE:-}
      RESUME_BUILDER_WORKSPACE_SYNC_KNOWN_HOSTS_FILE: ${RESUME_BUILDER_WORKSPACE_SYNC_KNOWN_HOSTS_FILE:-}
      RESUME_BUILDER_WORKSPACE_SYNC_TOKEN_FILE: ${RESUME_BUILDER_WORKSPACE_SYNC_TOKEN_FILE:-}
      JOB_PULLER_LINKEDIN_RESULTS_WANTED: ${JOB_PULLER_LINKEDIN_RESULTS_WANTED:-}
      TZ: ${RESUME_BUILDER_TIMEZONE:-America/New_York}
    ports:
      - "${RESUME_BUILDER_WEB_BIND:-127.0.0.1}:8766:8765"
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    volumes:
      - ${RESUME_BUILDER_WORKSPACE_PATH:?Set RESUME_BUILDER_WORKSPACE_PATH}:/workspace
      - ${RESUME_BUILDER_RUNTIME_PATH:?Set RESUME_BUILDER_RUNTIME_PATH}:/state
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./web
        - action: rebuild
          path: ./assistant-runtime
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./Dockerfile
