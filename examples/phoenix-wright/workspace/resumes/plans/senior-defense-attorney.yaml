concept_fit:
  - concept_id: complex-defense
    status: demonstrated
    fact_ids: [WAA-004, WAA-005]
    rationale: Independent-practice cases show complex defense work and ethical constraints.
  - concept_id: evidence-analysis
    status: demonstrated
    fact_ids: [WAA-004, WAA-006]
    rationale: Linked-proceeding reconstruction and a wrongful-conviction retrial directly demonstrate evidence analysis.
  - concept_id: practice-leadership
    status: demonstrated
    fact_ids: [FCO-003, WAA-015]
    rationale: Practice continuity and later co-counsel mentorship support careful leadership positioning.
  - concept_id: mentorship
    status: demonstrated
    fact_ids: [WAA-015]
    rationale: The confirmed senior-role fact supports a mentoring co-counsel contribution without relying on the unresolved interim title.
  - concept_id: cross-border-advocacy
    status: demonstrated
    fact_ids: [WAA-013, WAA-014]
    rationale: Two confirmed Khura'in matters demonstrate advocacy under an unfamiliar and unusually risky court system.
  - concept_id: professional-accountability
    status: demonstrated
    fact_ids: [WAA-008, WAA-012, BBC-002]
    rationale: The plan shows the adverse event, continued investigation, and reinstated return rather than hiding the interruption.
reviewer_risks:
  - id: disbarment-credibility
    concern: A disbarment can overwhelm the positive career argument if it is hidden or euphemized.
    status: partial
    fact_ids: [WAA-008, WAA-012]
    planning_action: State the unknowing presentation and seven-year interruption accurately, then lead the recent role with the confirmed return to practice.
  - id: collaborator-credit
    concern: Shared matters could make the resume overstate Phoenix's ownership of results.
    status: resolved
    fact_ids: [WAA-007, WAA-015]
    planning_action: Use qualified contribution language and name the temporary lead or decisive lead where relevant.
  - id: credential-specificity
    concern: A legal reader may expect a named bar jurisdiction even though canon does not provide one.
    status: resolved
    fact_ids: [CERT-001]
    planning_action: Show the supported attorney-badge reinstatement and do not invent a real-world jurisdiction.
presentation:
  competencies: omit
  competencies_job: Education and attorney status provide more useful legal-resume scan value than labels already demonstrated in the summary and experience.
  compressed_role_ids: [FCO-001, BBC-001]
