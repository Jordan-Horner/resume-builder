schema_version: 1
accepted_work_modes: []
# Fresh installs are deliberately neutral. Add explicit preferences only after
# reviewing discovery results; resume-derived concepts belong in a generated
# discovery draft, not in this durable preference file.
desired_title_terms: []
interest_terms: []
# Hard filters affect only the personal review queue. Matching inventory records
# remain available if these preferences change later.
excluded_title_terms: []
# Optional seniority gate: when a title contains one of the senior terms, it
# must also contain an accepted senior role term to enter the review queue.
senior_title_terms: []
accepted_senior_role_terms: []
unwanted_title_terms: []
excluded_companies: []
# Suppress only an exact opening while retaining future roles from the company.
# Values: applied or not_interested.
job_dispositions: {}
accepted_location_terms: []
excluded_location_terms: []
include_unknown_locations: true
minimum_salary: null
resume_globs:
  - resumes/baselines/*.md
  - resumes/tailored/*.md

# Optional semantic-screening evidence. Keep fields null or empty when they are
# unknown: the screener will report uncertainty instead of inventing an answer.
# These are per-workspace facts, never product-wide defaults.
screening_profile: {}
personalization:
  # Shadow mode produces an evaluation order but cannot hide jobs or change notifications.
  enabled: true
  mode: shadow
  exploration_fraction: 0.15
# Optional screening facts can be added when known:
