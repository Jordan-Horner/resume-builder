[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-builder"
version = "0.12.0"
description = "Git-first career vault tooling"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "playwright==1.62.0",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "reportlab>=4,<5",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
resume-builder = "resume_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_builder = [
  "resources/templates/*.html",
  "resources/workspace/*/*.md",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=resume_builder --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
markers = [
  "browser: requires the installed Playwright Chromium runtime",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
