name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install check dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and format
        run: ruff check src tests scripts .agents/skills/hydrate-vault/scripts && ruff format --check src tests scripts .agents/skills/hydrate-vault/scripts
      - name: Type check
        run: mypy src

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: npm ci --ignore-scripts && npm test
        working-directory: assistant-runtime
        env:
          NODE_ENV: production
          COPILOTKIT_TELEMETRY_DISABLED: "true"
          DO_NOT_TRACK: "1"

  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Jordan-Horner/resume-builder'
    needs: [quality, secrets, test, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build metadata
        id: metadata
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build candidate by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/jordan-horner/resume-builder,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
            BUILD_CHANNEL=main
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true
      - name: Test exact candidate from registry
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker pull "ghcr.io/jordan-horner/resume-builder@$IMAGE_DIGEST"
          sh scripts/smoke_container.sh "ghcr.io/jordan-horner/resume-builder@$IMAGE_DIGEST"
      - name: Validate Compose configuration
        env:
          RESUME_BUILDER_WORKSPACE_PATH: /tmp/resume-builder-workspace
          RESUME_BUILDER_RUNTIME_PATH: /tmp/resume-builder-runtime
        run: docker compose config --quiet
      - name: Record tested digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/tested-digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/tested-digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/tested-digests/*.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Jordan-Horner/resume-builder'
    needs: [quality, secrets, candidate, test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: container-main-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-digest-*
          path: ${{ runner.temp }}/tested-digests
          merge-multiple: true
      - name: Promote tested images if still current
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/tested-digests
        run: python scripts/promote_container_image.py
      - name: Announce successfully published image
        if: steps.promote.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          export BUILD_DATE=$(git show -s --format=%cI HEAD)
          python scripts/publish_container_release.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build automation image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: resume-builder-automation:ci
          cache-from: |
            type=gha,scope=container-validation
            type=gha,scope=container-amd64
          cache-to: type=gha,scope=container-validation,mode=max
      - name: Verify fresh container startup
        run: sh scripts/smoke_container.sh resume-builder-automation:ci
      - name: Validate Compose configuration
        env:
          RESUME_BUILDER_WORKSPACE_PATH: /tmp/resume-builder-workspace
          RESUME_BUILDER_RUNTIME_PATH: /tmp/resume-builder-runtime
        run: docker compose config --quiet

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install PDF browser
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: pytest
      - name: Build package
        if: matrix.python-version == '3.14'
        run: python -m build
      - name: Audit package boundary
        if: matrix.python-version == '3.14'
        run: python scripts/audit_distribution.py
      - name: Install wheel in a clean environment
        if: matrix.python-version == '3.14'
        run: |
          python -m venv /tmp/resume-builder-wheel
          /tmp/resume-builder-wheel/bin/python -m pip install dist/*.whl
          /tmp/resume-builder-wheel/bin/resume-builder --help
      - name: Validate wheel-installed first-run workspace
        if: matrix.python-version == '3.14'
        run: |
          /tmp/resume-builder-wheel/bin/resume-builder init \
            --workspace /tmp/resume-builder-clean-workspace --storage local \
            --git-name "CI User" --git-email "ci@example.invalid"
          RESUME_BUILDER_WORKSPACE=/tmp/resume-builder-clean-workspace \
            /tmp/resume-builder-wheel/bin/resume-builder report --strict
          test -z "$(find /tmp/resume-builder-clean-workspace/vault/facts \
            -type f -name '*.md' -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/vault/sources/normalized \
            -type f -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/resumes/baselines \
            -type f ! -name '.gitkeep' -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/resumes/plans \
            -type f ! -name '.gitkeep' -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/resumes/tailored \
            -type f ! -name '.gitkeep' -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/directions \
            -type f ! -name README.md -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/targets \
            -type f ! -name README.md -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/editorial \
            -type f -name '*.json' -print -quit)"
      - name: Validate fictional demonstration
        if: matrix.python-version == '3.14'
        run: |
          export RESUME_BUILDER_WORKSPACE="$PWD/examples/phoenix-wright/workspace"
          resume-builder validate --strict
          resume-builder direction validate
          resume-builder synthesis resumes/plans/senior-defense-attorney.yaml
          resume-builder verify resumes/baselines/senior-defense-attorney.md
