name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Jordan-Horner/resume-builder'
    needs: [secrets, container, test, frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: container-main-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Skip superseded builds
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "publish=$([ "$current" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build metadata
        if: steps.current.outputs.publish == 'true'
        id: metadata
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        if: steps.current.outputs.publish == 'true'
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/jordan-horner/resume-builder:main
            ghcr.io/jordan-horner/resume-builder:sha-${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
            BUILD_CHANNEL=main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Announce successfully published image
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_DATE: ${{ steps.metadata.outputs.date }}
        run: python scripts/publish_container_release.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build automation image
        run: docker build --tag resume-builder-automation:ci .
      - name: Smoke test image
        run: docker run --rm resume-builder-automation:ci --help
      - name: Validate Compose configuration
        env:
          RESUME_BUILDER_WORKSPACE_PATH: /tmp/resume-builder-workspace
          RESUME_BUILDER_RUNTIME_PATH: /tmp/resume-builder-runtime
        run: docker compose config --quiet

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install PDF browser
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: pytest
      - name: Lint and format
        run: ruff check src tests scripts .agents/skills/hydrate-vault/scripts && ruff format --check src tests scripts .agents/skills/hydrate-vault/scripts
      - name: Type check
        run: mypy src
      - name: Check architecture boundaries
        run: python scripts/check_architecture.py
      - name: Build package
        if: matrix.python-version == '3.14'
        run: python -m build
      - name: Audit package boundary
        if: matrix.python-version == '3.14'
        run: python scripts/audit_distribution.py
      - name: Install wheel in a clean environment
        if: matrix.python-version == '3.14'
        run: |
          python -m venv /tmp/resume-builder-wheel
          /tmp/resume-builder-wheel/bin/python -m pip install dist/*.whl
          /tmp/resume-builder-wheel/bin/resume-builder --help
      - name: Validate wheel-installed first-run workspace
        if: matrix.python-version == '3.14'
        run: |
          /tmp/resume-builder-wheel/bin/resume-builder init \
            --workspace /tmp/resume-builder-clean-workspace --storage local \
            --git-name "CI User" --git-email "ci@example.invalid"
          RESUME_BUILDER_WORKSPACE=/tmp/resume-builder-clean-workspace \
            /tmp/resume-builder-wheel/bin/resume-builder report --strict
          test -z "$(find /tmp/resume-builder-clean-workspace/vault/facts \
            -type f -name '*.md' -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/vault/sources/normalized \
            -type f -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/resumes/baselines \
            -type f ! -name '.gitkeep' -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/resumes/plans \
            -type f ! -name '.gitkeep' -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/resumes/tailored \
            -type f ! -name '.gitkeep' -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/directions \
            -type f ! -name README.md -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/targets \
            -type f ! -name README.md -print -quit)"
          test -z "$(find /tmp/resume-builder-clean-workspace/editorial \
            -type f -name '*.json' -print -quit)"
      - name: Validate fictional demonstration
        run: |
          export RESUME_BUILDER_WORKSPACE="$PWD/examples/phoenix-wright/workspace"
          resume-builder validate --strict
          resume-builder direction validate
          resume-builder synthesis resumes/plans/senior-defense-attorney.yaml
          resume-builder verify resumes/baselines/senior-defense-attorney.md
      - name: Check public demo assets
        run: python scripts/check_demo_assets.py
