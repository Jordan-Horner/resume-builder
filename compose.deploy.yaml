# Registry deployment. One container owns the portal and managed workers.
services:
  resume-builder:
    image: ghcr.io/jordan-horner/resume-builder:${RESUME_BUILDER_IMAGE_TAG:-main}
    restart: unless-stopped
    command: ["serve"]
    environment:
      RESUME_BUILDER_WORKSPACE: /workspace
      RESUME_BUILDER_AUTOMATION_STATE: /state/automation-state.sqlite
      RESUME_BUILDER_GMAIL_STATE: /state/gmail-state.sqlite
      RESUME_BUILDER_GMAIL_TOKEN: /state/gmail-token.json
      RESUME_BUILDER_AGENT_STATE: /state/agent-state.sqlite
      RESUME_BUILDER_TELEGRAM_TOKEN_FILE: /state/telegram-bot-token
      RESUME_BUILDER_STATE_DIR: /state
      RESUME_BUILDER_WEB_PORT: 8765
      RESUME_BUILDER_DISCORD_WEBHOOK: ${RESUME_BUILDER_DISCORD_WEBHOOK:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RESUME_BUILDER_TELEGRAM_BOT_TOKEN: ${RESUME_BUILDER_TELEGRAM_BOT_TOKEN:-}
      RESUME_BUILDER_LOG_LEVEL: ${RESUME_BUILDER_LOG_LEVEL:-INFO}
      JOB_PULLER_LINKEDIN_RESULTS_WANTED: ${JOB_PULLER_LINKEDIN_RESULTS_WANTED:-}
      TZ: ${RESUME_BUILDER_TIMEZONE:-America/New_York}
    ports:
      - "${RESUME_BUILDER_WEB_BIND:-127.0.0.1}:${RESUME_BUILDER_WEB_PORT:-8766}:8765"
    volumes:
      - ${RESUME_BUILDER_WORKSPACE_PATH:-resume-builder-workspace}:/workspace
      - ${RESUME_BUILDER_RUNTIME_PATH:-resume-builder-state}:/state
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  workspace:
    name: resume-builder-workspace
  state:
    name: resume-builder-state
